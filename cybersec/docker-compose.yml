services:
  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8080:80"
    restart: unless-stopped

  webgoat:
    image: webgoat/webgoat
    ports:
      - "8081:8080"
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  mutillidae:
    image: citizenstig/nowasp
    ports:
      - "8082:80"
    restart: unless-stopped

  bwapp:
    image: raesene/bwapp
    ports:
      - "8083:80"
    restart: unless-stopped

  vapi:
    image: roottusk/vapi
    ports:
      - "8084:80"
    restart: unless-stopped
